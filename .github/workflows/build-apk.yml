name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build APKs (debug + release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Chat-APKs
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  release:
    name: Attach APKs to GitHub Release
    # Pushing a tag like v1.0.0 also publishes the APKs to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: LLM-Chat-APKs
          path: apks

      - name: Attach APKs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
