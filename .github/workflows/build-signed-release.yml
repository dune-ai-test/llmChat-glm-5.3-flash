name: Build signed release APK

# Runs on every v* tag AND can be started manually (Actions tab -> Run workflow).
# Every successful run publishes the signed APK to the GitHub Releases page
# (manual runs publish under v<versionName>, creating the tag if needed).
# Requires repository Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set (add it under Settings > Secrets and variables > Actions > Secrets)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$SIGNER" ]; then
            echo "apksigner not found on runner - falling back to jarsigner"
            jarsigner -verify -certs "$APK" | head -5
          else
            "$SIGNER" verify --print-certs "$APK"
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Aster-signed-release-apk
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Release
        permissions:
          contents: write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            TAG="v$VER"
          fi
          ASSET="Aster-$TAG-release-signed.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Aster $TAG" \
              --notes "Signed release build - version $TAG (run $GITHUB_RUN_ID)."
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          echo "Published $ASSET to release $TAG:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
