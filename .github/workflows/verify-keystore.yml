name: Verify release keystore

# Fast sanity check of the signing credentials (no Gradle build).
# Verifies: base64 decodes to a keystore, store password unlocks it,
# the alias exists, and the key password can actually recover the key
# (the "Cannot recover key" failure). Runs ~10s instead of minutes.

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify keystore & passwords
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set (Secrets or Variables)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Decoded $(stat -c%s release.keystore) bytes"
          if keytool -list -keystore release.keystore -storepass "" -v >/dev/null 2>&1; then
            echo "note: keystore has no store password"
          fi
          file release.keystore

      - name: Store password + alias exists
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$STOREPASS" ]; then echo "::error::ANDROID_KEYSTORE_PASSWORD is not set"; exit 1; fi
          if [ -z "$ALIAS" ]; then echo "::error::ANDROID_KEY_ALIAS is not set"; exit 1; fi
          echo "--- aliases in keystore ---"
          keytool -list -keystore release.keystore -storepass "$STOREPASS" > aliases.txt 2>&1 || {
            echo "::error::Store password is WRONG (keytool could not open the keystore)"
            head -5 aliases.txt || true
            exit 1
          }
          grep -i "$ALIAS" aliases.txt || {
            echo "::error::Alias '$ALIAS' not found in keystore"
            exit 1
          }
          echo "OK: store password unlocks keystore and alias '$ALIAS' exists"

      - name: Key password can recover the key
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KP="$KEYPASS"
          if [ -z "$KP" ]; then
            KP="$STOREPASS"
            echo "ANDROID_KEY_PASSWORD is blank - testing with the store password (Gradle fallback)"
          fi
          if ! keytool -importkeystore \
              -srckeystore release.keystore -srcstorepass "$STOREPASS" \
              -srcalias "$ALIAS" -srckeypass "$KP" \
              -destkeystore check.p12 -deststoretype PKCS12 -deststorepass "temp-only-1234" \
              -noprompt 2> keycheck.err; then
            echo "::error::ANDROID_KEY_PASSWORD is WRONG - the key could not be recovered. If you pressed Enter at the keytool key-password prompt, set ANDROID_KEY_PASSWORD to the SAME value as ANDROID_KEYSTORE_PASSWORD (or delete it - blank now falls back to the store password)."
            head -5 keycheck.err || true
            exit 1
          fi
          echo "OK: key '$ALIAS' recovered - all four values are correct" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          echo "## Keystore verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- base64 decode, store password, alias presence and key recovery were checked above" >> "$GITHUB_STEP_SUMMARY"
          rm -f release.keystore check.p12 aliases.txt keycheck.err
